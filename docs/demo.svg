<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 587" width="716" height="587" role="img" aria-label="token-drift terminal output: estimated cost, the changes it found between Claude Code versions, and a per-version table">
<rect width="716" height="587" rx="10" fill="#0d1117"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" style="white-space: pre">
<text x="18" y="32" xml:space="preserve"><tspan fill="#e6edf3">$ npx token-drift</tspan></text>
<text x="18" y="51" xml:space="preserve"></text>
<text x="18" y="70" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">  token-drift</tspan><tspan fill="#8b949e"> · see what each Claude Code update costs you</tspan></text>
<text x="18" y="89" xml:space="preserve"><tspan fill="#8b949e">  ───────────────────────────────────────────────────────</tspan></text>
<text x="18" y="108" xml:space="preserve"></text>
<text x="18" y="127" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">$230.45</tspan><tspan fill="#e6edf3"> estimated at API list prices</tspan></text>
<text x="18" y="146" xml:space="preserve"><tspan fill="#8b949e">  993 turns · 20 sessions · Oct 6 – Nov 5, 2026</tspan></text>
<text x="18" y="165" xml:space="preserve"></text>
<text x="18" y="184" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">▲</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">2.1.311</tspan><tspan fill="#e6edf3"> → </tspan><tspan fill="#e6edf3" font-weight="700">2.1.314</tspan><tspan fill="#e6edf3">: 120% more output tokens</tspan><tspan fill="#8b949e"> (release: same model and effort)</tspan></text>
<text x="18" y="203" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#3fb950">▼</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">2.1.314</tspan><tspan fill="#e6edf3"> → </tspan><tspan fill="#e6edf3" font-weight="700">2.1.319</tspan><tspan fill="#e6edf3">: 45% fewer output tokens</tspan><tspan fill="#8b949e"> (model: opus-5-5 → fable-5-2)</tspan></text>
<text x="18" y="222" xml:space="preserve"></text>
<text x="18" y="241" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">Version         </tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e">Turns</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e"> Output</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e">      Δ</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e"> $/turn</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e"> Think</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e"> Cache</tspan></text>
<text x="18" y="260" xml:space="preserve"><tspan fill="#8b949e">  ─────────────────┼───────┼─────────┼─────────┼─────────┼────────┼───────</tspan></text>
<text x="18" y="279" xml:space="preserve"><tspan fill="#e6edf3">  2.1.306          │   110 │    1.2K │         │   $0.22 │    308 │  95.6%</tspan></text>
<text x="18" y="298" xml:space="preserve"><tspan fill="#e6edf3">  2.1.310          │   300 │    1.2K │         │   $0.20 │    278 │  95.6%</tspan></text>
<text x="18" y="317" xml:space="preserve"><tspan fill="#e6edf3">  2.1.311          │   276 │    1.1K │         │   $0.21 │    278 │  95.8%</tspan></text>
<text x="18" y="336" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">2.1.312         </tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e">   14</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e">   1.1K</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e">  low n</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e">  $0.14</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e">   259</tspan><tspan fill="#e6edf3"> │ </tspan><tspan fill="#8b949e"> 95.4%</tspan></text>
<text x="18" y="355" xml:space="preserve"><tspan fill="#e6edf3">  2.1.314          │   116 │    2.5K │ </tspan><tspan fill="#ff7b72">  ↑120%</tspan><tspan fill="#e6edf3"> │   $0.23 │    586 │  95.7%</tspan></text>
<text x="18" y="374" xml:space="preserve"><tspan fill="#e6edf3">  2.1.319          │   177 │    1.4K │ </tspan><tspan fill="#3fb950">   ↓45%</tspan><tspan fill="#e6edf3"> │   $0.34 │    405 │  95.7%</tspan></text>
<text x="18" y="393" xml:space="preserve"><tspan fill="#8b949e">  ─────────────────┴───────┴─────────┴─────────┴─────────┴────────┴───────</tspan></text>
<text x="18" y="412" xml:space="preserve"></text>
<text x="18" y="431" xml:space="preserve"><tspan fill="#8b949e">  Output, $/turn and Think are per-turn medians; Δ marks a significant change.</tspan></text>
<text x="18" y="450" xml:space="preserve"><tspan fill="#8b949e">  low n = fewer than 20 turns, too few to compare.</tspan></text>
<text x="18" y="469" xml:space="preserve"><tspan fill="#8b949e">  Cost is an estimate (tokens × Anthropic API list prices), not a bill.</tspan></text>
<text x="18" y="488" xml:space="preserve"><tspan fill="#8b949e">  On a subscription, it is what the same usage would cost through the API.</tspan></text>
<text x="18" y="507" xml:space="preserve"></text>
<text x="18" y="526" xml:space="preserve"><tspan fill="#8b949e">  Run again after your next Claude Code update to see what it changed.</tspan></text>
<text x="18" y="545" xml:space="preserve"><tspan fill="#8b949e">  Share it: npx token-drift --compact</tspan></text>
<text x="18" y="564" xml:space="preserve"><tspan fill="#8b949e">  ★ github.com/tsaagan/token-drift</tspan></text>
</g>
</svg>
