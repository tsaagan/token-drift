name: Announce release

on:
  release:
    types: [published]

jobs:
  tweet:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    steps:
      - name: Tweet
        uses: ethomson/send-tweet-action@v2
        with:
          status: |
            token-drift ${{ github.event.release.tag_name }} is out 🦖

            See what each Claude Code update costs you, right from your terminal.

            npx token-drift

            https://github.com/tsaagan/token-drift/releases/tag/${{ github.event.release.tag_name }}
          consumer-key: ${{ secrets.TWITTER_CONSUMER_KEY }}
          consumer-secret: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
